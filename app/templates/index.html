<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #f9f9f9; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; }
        button { cursor: pointer; background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px;}
        .btn-danger { background: #dc3545; text-decoration: none; color: white; padding: 5px 10px; border-radius: 4px; font-size: 0.9em;}
    </style>
</head>
<body>
    <h1>Gestão de Produtos</h1>

    <div class="card">
        <h3>Novo Produto</h3>
        <form method="POST">
            <input type="text" name="name" placeholder="Nome do Produto" required>
            <input type="number" step="0.01" name="price" placeholder="Preço (R$)" required>
            <input type="number" name="stock" placeholder="Qtd Estoque" required>
            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>R$ {{ product.price }}</td>
                <td>{{ product.stock }}</td>
                <td>
                    <a href="{{ url_for('main.edit', id=product.id) }}" 
                       style="color: blue; text-decoration: none; margin-right: 10px;">
                       Editar
                    </a>

                    <a href="{{ url_for('main.delete_product', id=product.id) }}" class="btn-danger">
                       Excluir
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
