<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; width: 50%; margin: auto; border-radius: 8px; background: #f9f9f9; }
        input { width: 95%; padding: 8px; margin: 5px 0; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; }
        a { text-decoration: none; color: #555; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Editar Produto</h2>
        
        <form method="POST">
            <label>Nome:</label>
            <input type="text" name="name" value="{{ product.name }}" required>
            
            <label>Preço:</label>
            <input type="number" step="0.01" name="price" value="{{ product.price }}" required>
            
            <label>Estoque:</label>
            <input type="number" name="stock" value="{{ product.stock }}" required>

            <button type="submit">Salvar Alterações</button>
            <a href="{{ url_for('main.index') }}">Cancelar</a>
        </form>
    </div>
</body>
</html>
